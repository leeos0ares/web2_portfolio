<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfólio de Projetos - Samuel e Leo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark menu fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#inicio">Portfolio de projetos LEGAIS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-links">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu-links">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#habilidades">Habilidades</a></li>
          <li class="nav-item"><a class="nav-link" href="#projetos">Projetos</a></li>
          <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header id="inicio" class="apresentacao">
    <div class="container">
      <div class="row align-items-center g-4">

        <div class="col-lg-6">
          <div class="row g-3">
            <div class="col-sm-6">
              <div class="autor text-center">
                <div class="foto">S</div>
                <h2 class="h5 mt-3">Samuel</h2>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="autor text-center">
                <div class="foto">L</div>
                <h2 class="h5 mt-3">Leo</h2>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section id="habilidades" class="py-5">
      <div class="container">
        <h2 class="titulo-secao">Habilidades</h2>
        <div class="d-flex flex-wrap gap-2">
          <span class="badge habilidade">HTML</span>
          <span class="badge habilidade">CSS</span>
          <span class="badge habilidade">JavaScript</span>
          <span class="badge habilidade">Bootstrap</span>
          <span class="badge habilidade">SQL</span>
          <span class="badge habilidade">Git</span>
        </div>
      </div>
    </section>

    <section id="projetos" class="py-5 fundo-claro">
      <div class="container">
        <h2 class="titulo-secao">Projetos</h2>

        <div class="row justify-content-center">
          <div class="col-md-9 col-lg-7">

            <div id="cartao-projeto" class="card projeto shadow">
              <div class="projeto-topo" id="projeto-icone"></div>
              <div class="card-body p-4">
                <span class="badge bg-secondary mb-2" id="projeto-cliente"></span>
                <h3 class="card-title h4" id="projeto-titulo"></h3>
                <p class="card-text text-muted" id="projeto-resumo"></p>
                <button id="btn-detalhes" class="btn btn-destaque">Ver detalhes</button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
              <button id="btn-anterior" class="btn btn-outline-secondary">Anterior</button>
              <span id="contador" class="text-muted"></span>
              <button id="btn-proximo" class="btn btn-outline-secondary">Próximo</button>
            </div>

          </div>
        </div>
      </div>
    </section>

    <section id="contato" class="py-5">
      <div class="container">
        <h2 class="titulo-secao">Contato</h2>

        <div class="row justify-content-center">
          <div class="col-md-9 col-lg-7">
            <form id="formulario" class="card card-body shadow-sm p-4">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Seu nome">
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="text" class="form-control" id="email" placeholder="seuemail@exemplo.com">
              </div>
              <div class="mb-3">
                <label for="mensagem" class="form-label">Mensagem</label>
                <textarea class="form-control" id="mensagem" rows="4" placeholder="Escreva sua mensagem"></textarea>
              </div>
              <button type="submit" class="btn btn-destaque">Enviar</button>
              <div id="resposta" class="alert mt-3 mb-0 d-none"></div>
            </form>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="rodape text-center py-4">
    <p class="mb-0">© 2026 primeira unidade web 2</p>
  </footer>

  <div id="janela" class="janela-fundo">
    <div class="janela-caixa">
      <h3 id="janela-titulo" class="h4"></h3>
      <p id="janela-cliente" class="text-muted"></p>
      <p id="janela-texto"></p>
      <p><strong>Tecnologias:</strong> <span id="janela-tecnologias"></span></p>
      <button id="btn-fechar" class="btn btn-destaque">Fechar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
